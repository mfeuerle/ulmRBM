name: Run Pytests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # full environment including the optional dependencies (FEniCSx, kron)
  test-full:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: tests
          environment-file: environment.yml
          cache-environment: true
          cache-environment-key: "env-${{ hashFiles('environment.yml') }}"
          create-args: >-
            python=3.12

      - name: Run pytest
        shell: bash -l {0}
        # unbuffered and in its own session, such that the log shows how far pytest got and with which
        # status it ended, even if the process group gets terminated (as seen with exit code 143)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          setsid --wait pytest -v && status=0 || status=$?
          echo "pytest exited with status $status"
          exit $status

  # only the required dependencies, the optional tests are skipped
  test-minimal:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install numpy scipy pytest

      - name: Run pytest
        run: pytest -v -rs
