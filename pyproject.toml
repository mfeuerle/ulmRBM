[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ulmRBM"
version = "0.1"
description = "Reduced Basis Methods for Parametrized Partial Differential Equations"
authors = [{ name = "Moritz Feuerle (Ulm University)" }]
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["."]
include = ["ulmRBM*"]

[tool.setuptools.package-dir]
"" = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# the scripts take several minutes, run them explicitly via `pytest -m scripts`
addopts = "-m 'not scripts'"
markers = [
    "slow: tests with noticeable runtime (e.g. greedy algorithms or SCM)",
    "scripts: smoke tests running the scripts in scripts/ (deselected by default)",
]
filterwarnings = [
    # efficiency warnings are expected when testing matrix-free / Kronecker formats with direct solvers
    "ignore:Efficentcy warning:UserWarning",
    "ignore:No solver specified; using default solver.:UserWarning",
]
